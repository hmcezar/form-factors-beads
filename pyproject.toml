[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "form-factors-beads"
version = "0.1.0"
description = "Derive SAXS and SANS coarse-grained bead form factors from atomistic trajectories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "MDAnalysis>=2.5",
  "matplotlib>=3.7",
  "networkx>=3.0",
  "numpy>=1.24",
  "periodictable>=1.6",
  "PyYAML>=6.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["build>=1", "pytest>=7", "ruff>=0.6"]

[project.scripts]
form-factors-beads = "form_factors_beads.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
form_factors_beads = ["data/*.yaml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: scientific regressions requiring the external TX9 trajectory",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
