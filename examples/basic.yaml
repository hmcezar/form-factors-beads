# Paths supplied on the command line are resolved independently of this file.
q:
  minimum: 0.0
  maximum: 2.0
  step: 0.01

trajectory:
  selection: all
  start: 0
  stop: null
  stride: 1
  guess_bonds: false

fit:
  degree: 6
  enforce_f0: true
  low_q_max: 0.75
  low_q_weight: 5.0

saxs:
  enabled: true
  solvent_electron_density: 0.334
  # A bead key changes only that bead. A group:B6 key changes every member of
  # the automatically discovered B6 identity group.
  electron_density_overrides: {}
  # Unsupported elements must be supplied explicitly, in A^3.
  excluded_volume_overrides: {}

sans:
  polynomial: true
  one_parameter: true
  # 1-based mapping atom index: isotope label, e.g. 14: D or 7: C-13.
  isotope_overrides: {}

identity:
  force_groups: {}
  force_split: []

sign:
  default_width: 0.03
  crossovers: {}
  widths: {}
